name: Build and Attach .exe to GitHub Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -D @rolldown/binding-win32-x64-msvc --legacy-peer-deps || true

      - name: Install Electron packaging tools
        run: npm install -D electron electron-builder --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Compile Windows .exe Installer
        run: npx --yes electron-builder --win nsis --publish never

      - name: Upload .exe to GitHub Actions Artifacts (Always available)
        uses: actions/upload-artifact@v4
        with:
          name: DeskMail-AI-Windows-Installer
          path: dist-electron/*.exe
          if-no-files-found: warn

      - name: Upload .exe to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: dist-electron/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
